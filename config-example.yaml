# Image dimensions
dimensions:
  portrait_size: [1080, 1920]  # width x height
  landscape_size: [1920, 1080]  # width x height
  # Upload the cropped pixels as-is instead of resizing to the sizes above; the
  # sizes then only set each crop's aspect ratio. Larger files, maximum quality.
  native_resolution: false

# Immich configuration
immich:
  url: "http://{IMMICH_URL_HERE}:2283"
  api_key: "YOUR_IMMICH_API_KEY"
  input_album_id: "YOUR_INPUT_ALBUM_ID"
  output_album_id: "YOUR_OUTPUT_ALBUM_ID"
  # Optional: send each orientation to its own album instead of the shared one
  # above. An orientation without its own entry falls back to output_album_id.
  # output_album_portrait_id: "YOUR_PORTRAIT_ALBUM_ID"
  # output_album_landscape_id: "YOUR_LANDSCAPE_ALBUM_ID"

# Meural Canvas configuration
meural:
  devices:
    - name: "Living Room"
      ip: "192.168.1.136"
      preview_duration: 10  # seconds
    - name: "Sitting Room"
      ip: "192.168.1.135"
      preview_duration: 10  # seconds

# How often to sync the input album, in minutes (0 = off)
sync:
  interval_minutes: 15

# The frame drawn around Review previews: light-wood, dark-wood, black or white
display:
  frame: light-wood