# Image dimensions
dimensions:
  portrait_size: [1080, 1920]  # width x height
  landscape_size: [1920, 1080]  # width x height

# Immich configuration
immich:
  url: "http://{IMMICH_URL_HERE}:2283"
  api_key: "YOUR_IMMICH_API_KEY"
  input_album_id: "YOUR_INPUT_ALBUM_ID"
  output_album_id: "YOUR_OUTPUT_ALBUM_ID"

# Meural Canvas configuration
meural:
  devices:
    - name: "Living Room"
      ip: "192.168.1.136"
      preview_duration: 10  # seconds
    - name: "Sitting Room"
      ip: "192.168.1.135"
      preview_duration: 10  # seconds